site_name: HUYNH CONG TU Learning Hub
site_description: Embedded Systems • Microelectronics • IC Design
site_author: Huynh Cong Tu
site_url: ""

theme:
  name: material
  language: vi
  logo: assets/images/hct-logo.svg
  favicon: assets/images/hct-logo.svg
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-night
        name: Chuyển sang chế độ tối
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Chuyển sang chế độ sáng
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

nav:
  - Trang chủ: index.md

  - Embedded Systems:
      - Tổng quan: courses/embedded-systems/index.md
      - Kỹ thuật Vi điều khiển:
          - Tổng quan học phần: courses/embedded-systems/microcontroller/index.md
          - Đề cương học tập: courses/embedded-systems/microcontroller/syllabus.md
          - Learning Path: courses/embedded-systems/microcontroller/learning-path.md
          - Toolchain & KIT: courses/embedded-systems/microcontroller/toolchain.md
          - Đánh giá & minh chứng: courses/embedded-systems/microcontroller/assessment.md
          - Bản đồ tài liệu nguồn: courses/embedded-systems/microcontroller/source-map.md
          - Thư viện hình minh họa: courses/embedded-systems/microcontroller/illustrations.md

          - Lý thuyết 15 buổi:
              - Buổi 01 · Hệ thống nhúng, hệ đếm & CPU: courses/embedded-systems/microcontroller/weeks/week01.md
              - Buổi 02 · Phần cứng tối thiểu & bộ nhớ: courses/embedded-systems/microcontroller/weeks/week02.md
              - Buổi 03 · RAM, clock & định địa chỉ: courses/embedded-systems/microcontroller/weeks/week03.md
              - Buổi 04 · Assembly, C & build: courses/embedded-systems/microcontroller/weeks/week04.md
              - Buổi 05 · C, GPIO & chống dội: courses/embedded-systems/microcontroller/weeks/week05.md
              - Buổi 06 · Timer & UART: courses/embedded-systems/microcontroller/weeks/week06.md
              - Buổi 07 · Tính Timer & baud rate: courses/embedded-systems/microcontroller/weeks/week07.md
              - Buổi 08 · Ngắt & lập lịch: courses/embedded-systems/microcontroller/weeks/week08.md
              - Buổi 09 · Dữ liệu dùng chung với ISR: courses/embedded-systems/microcontroller/weeks/week09.md
              - Buổi 10 · Nguồn, bus & LED 7 đoạn: courses/embedded-systems/microcontroller/weeks/week10.md
              - Buổi 11 · LCD, keypad & LED matrix: courses/embedded-systems/microcontroller/weeks/week11.md
              - Buổi 12 · Motor, I²C & DS1307: courses/embedded-systems/microcontroller/weeks/week12.md
              - Buổi 13 · ADC, DAC & thiết kế ngoại vi: courses/embedded-systems/microcontroller/weeks/week13.md
              - Buổi 14 · Tích hợp dự án & kiểm thử: courses/embedded-systems/microcontroller/weeks/week14.md
              - Buổi 15 · Ôn tập & bài tập tổng hợp: courses/embedded-systems/microcontroller/weeks/week15.md

          - Thực hành:
              - Lộ trình 10 bài: courses/embedded-systems/microcontroller/labs/index.md
              - Lab 01 · Keil, Proteus & Blink LED: courses/embedded-systems/microcontroller/labs/lab01.md
              - Lab 02 · Nút nhấn & chống dội: courses/embedded-systems/microcontroller/labs/lab02.md
              - Lab 03 · Quét 4 LED 7 đoạn: courses/embedded-systems/microcontroller/labs/lab03.md
              - Lab 04 · LCD 1602 4-bit: courses/embedded-systems/microcontroller/labs/lab04.md
              - Lab 05 · LED matrix 8×8: courses/embedded-systems/microcontroller/labs/lab05.md
              - Lab 06 · ADC0804 + LM35: courses/embedded-systems/microcontroller/labs/lab06.md
              - Lab 07 · DAC0808 & waveform: courses/embedded-systems/microcontroller/labs/lab07.md
              - Lab 08 · PWM & tải điện áp thấp: courses/embedded-systems/microcontroller/labs/lab08.md
              - Lab 09 · Hồng ngoại NEC: courses/embedded-systems/microcontroller/labs/lab09.md
              - Lab 10 · UART với máy tính: courses/embedded-systems/microcontroller/labs/lab10.md

          - Mở rộng & Project:
              - Keypad 4×4: courses/embedded-systems/microcontroller/extensions/keypad.md
              - RTC DS1307: courses/embedded-systems/microcontroller/extensions/ds1307.md
              - Thermostat Project: courses/embedded-systems/microcontroller/extensions/thermostat-project.md

  - Microelectronics:
      - Tổng quan: courses/microelectronics/index.md

  - IC Design:
      - Tổng quan: courses/ic-design/index.md

  - Resources:
      - Tổng quan: resources/index.md
      - Software: resources/software.md
      - Datasheets: resources/datasheets.md
      - Source Code: resources/source-code.md
      - Learning Tools: resources/learning-tools.md

  - About: about.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/extra.js

extra:
  generator: false

copyright: © 2026 Huynh Cong Tu · Learning Hub
